name: Finland CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional contribution branch to test before opening an upstream PR
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve upstream dependencies
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ -n "$SOURCE_REF" ]; then
            go mod tidy
          fi
          go mod download && go mod verify
      - name: Test native login options and related packages
        run: go test -mod=readonly -count=1 -timeout=120s ./http/controller/api ./utils ./service ./lib/jwt ./lib/lock
      - name: Check formatting
        run: test -z "$(gofmt -l http/controller/api/login.go http/controller/api/login_test.go)"
      - name: Install static C toolchain for SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build Linux amd64 backend
        env:
          CGO_ENABLED: '1'
          CC: musl-gcc
        run: |
          mkdir -p out
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '4.1.8-korsun.%s\n' "${SOURCE_SHA:0:7}" > resources/version
          go build -trimpath -ldflags '-s -w -linkmode external -extldflags "-static"' -o out/apimain ./cmd/apimain.go
          printf '%s\n' "$SOURCE_SHA" > out/COMMIT
          cd out
          sha256sum apimain > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: rustdesk-api-linux-amd64
          path: out/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: module-lock
          path: |
            go.mod
            go.sum
          retention-days: 14
